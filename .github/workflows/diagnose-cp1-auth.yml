name: diagnose-cp1-auth
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read signin.php users.json from CP1
        run: |
          FTP="ftp://s4411.lon1.stableserver.net"
          CREDS="${{ secrets.FTP_USER }}:${{ secrets.FTP_PASS }}"

          echo "=== signin.php ==="
          curl -s --connect-timeout 20 --max-time 30 \
            "$FTP/public_html/api/auth/signin.php" -u "$CREDS" || echo "FAILED"

          echo ""
          echo "=== signup.php ==="
          curl -s --connect-timeout 20 --max-time 30 \
            "$FTP/public_html/api/auth/signup.php" -u "$CREDS" || echo "FAILED"

          echo ""
          echo "=== /public_html/users.json ==="
          curl -s --connect-timeout 20 --max-time 30 \
            "$FTP/public_html/users.json" -u "$CREDS" || echo "FILE NOT FOUND"

          echo ""
          echo "=== /public_html/api/auth/users.json ==="
          curl -s --connect-timeout 20 --max-time 30 \
            "$FTP/public_html/api/auth/users.json" -u "$CREDS" || echo "FILE NOT FOUND"
