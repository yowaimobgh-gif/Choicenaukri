name: Fix CP1 auth signup signin
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Upload fixed signup.php and signin.php to CP1
        env:
          SIGNUP_B64: 
          SIGNIN_B64: 
        run: |
          FTP="ftp://s4411.lon1.stableserver.net"
          CREDS="${{ secrets.FTP_USER }}:${{ secrets.FTP_PASS }}"

          echo "$SIGNUP_B64" | base64 -d > signup.php
          echo "$SIGNIN_B64" | base64 -d > signin.php
          # Empty users array as seed
          echo '[]' > users.json

          echo "Uploading signup.php..."
          curl -s --connect-timeout 20 --max-time 30             -T signup.php "$FTP/public_html/api/auth/signup.php" -u "$CREDS"             && echo "✅ signup.php" || echo "❌ signup.php"

          echo "Uploading signin.php..."
          curl -s --connect-timeout 20 --max-time 30             -T signin.php "$FTP/public_html/api/auth/signin.php" -u "$CREDS"             && echo "✅ signin.php" || echo "❌ signin.php"

          echo "Seeding users.json at public_html root..."
          curl -s --connect-timeout 20 --max-time 30             -T users.json "$FTP/public_html/users.json" -u "$CREDS"             && echo "✅ users.json seeded" || echo "❌ users.json"

          echo "Verify path accessible..."
          curl -s --connect-timeout 15 -u "$CREDS" "$FTP/public_html/" | grep users.json || echo "(users.json not listed yet)"
