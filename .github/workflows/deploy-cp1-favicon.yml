name: Deploy favicon and index to CP1
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Upload index.html and favicon.svg to CP1
        env:
          INDEX_B64: 
          FAVICON_B64: 
        run: |
          FTP="ftp://s4411.lon1.stableserver.net"
          CREDS="${{ secrets.FTP_USER }}:${{ secrets.FTP_PASS }}"

          echo "$INDEX_B64" | base64 -d > index.html
          echo "$FAVICON_B64" | base64 -d > favicon.svg

          echo "=== index.html og:image line ==="
          grep "og:image" index.html

          curl -s --connect-timeout 20 --max-time 30             -T index.html "$FTP/public_html/index.html" -u "$CREDS"             && echo "✅ index.html uploaded" || echo "❌ index.html FAILED"

          curl -s --connect-timeout 20 --max-time 30             -T favicon.svg "$FTP/public_html/favicon.svg" -u "$CREDS"             && echo "✅ favicon.svg uploaded" || echo "❌ favicon.svg FAILED"
